<html>  
<head><title>Form Validation</title></head><body> 
<h2>Student Registration Form</h2><form onsubmit="return validate()"> 
Name:   <input type="text" id="name"><br><br> 
Email:   <input type="email" id="email"><br><br> 
Password:   <input type="password" id="pass"><br><br> 
Mobile:     <input type="text" id="mobile"><br><br> 
<input type="submit" value="Submit">     </form> 
<script>    function validate()   {var n = 
document.getElementById("name").value;  var e = 
document.getElementById("email").value;var p = 
document.getElementById("pass").value;   var m = 
document.getElementById("mobile").value; 
if(n == "" || e == "" || p == "" || m == "")   {alert("Please fill all fields");return 
false;}if(p.length < 6)  {alert("Password must be 6 characters"); return false; } 
if(m.length != 10 || isNaN(m))  {  alert("Enter valid mobile number");  return 
false;  alert("Form Submitted Successfully!");  return false;  } </script> 
</body> 
</html>
